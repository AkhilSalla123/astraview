services:
  # Python Orbit Engine
  - type: web
    name: astraview-orbit-service
    env: docker
    dockerContext: ./astraview/orbit-service
    dockerfilePath: ./astraview/orbit-service/Dockerfile
    plan: free
    healthCheckPath: /health

  # Spring Boot Backend API
  - type: web
    name: astraview-backend
    env: docker
    dockerContext: ./astraview/astraview-backend
    dockerfilePath: ./astraview/astraview-backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: MONGODB_URI
        value: "mongodb+srv://akhilsalla650_db_user:ywe05hTi6wlpAFoe@cluster0.e0fit5p.mongodb.net/astraview?retryWrites=true&w=majority&appName=Cluster0"
      - key: ORBIT_SERVICE_URL
        value: "https://astraview-orbit-service.onrender.com"
      - key: CORS_ORIGINS
        value: "*"
      - key: N2YO_API_KEY
        value: ""

  # React + Cesium Frontend
  - type: web
    name: astraview-frontend
    env: docker
    dockerContext: ./astraview/astraview-frontend
    dockerfilePath: ./astraview/astraview-frontend/Dockerfile
    plan: free
    healthCheckPath: /health
