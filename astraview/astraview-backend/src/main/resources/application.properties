spring.application.name=astraview-backend
server.port=8080

# MongoDB (use your own Atlas URI via env var; never commit credentials)
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/astraview}}
spring.data.mongodb.auto-index-creation=true

# Python SGP4 orbit service
orbit.service.url=${ORBIT_SERVICE_URL:http://localhost:8000}

# TLE sources: N2YO is used when a key is set, otherwise CelesTrak
n2yo.api-key=${N2YO_API_KEY:}
n2yo.base-url=https://api.n2yo.com/rest/v1/satellite
celestrak.base-url=https://celestrak.org/NORAD/elements/gp.php

# CORS (comma separated)
astraview.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Simulated antenna / ground-station receiver
antenna.max-slew-deg-s=6.0
antenna.beamwidth-deg=10.0
antenna.gain-dbi=12.0
antenna.tx-power-dbm=30.0
antenna.noise-floor-dbm=-118.0
