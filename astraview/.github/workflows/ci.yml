name: CI
on: [push, pull_request]
jobs:
  orbit-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: orbit-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: astraview-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: astraview-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: astraview-frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
