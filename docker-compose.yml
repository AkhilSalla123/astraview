# AstraView - Root Docker Compose
# Run everything from root directory: docker compose up --build
# Open http://localhost:3000

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "${PORT_MONGO:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  orbit-service:
    build: ./astraview/orbit-service
    restart: unless-stopped
    ports:
      - "${PORT_ORBIT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./astraview/astraview-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/astraview}
      ORBIT_SERVICE_URL: http://orbit-service:8000
      N2YO_API_KEY: ${N2YO_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,*}
    depends_on:
      mongo:
        condition: service_healthy
      orbit-service:
        condition: service_healthy
    ports:
      - "${PORT_BACKEND:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./astraview/astraview-frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT_FRONTEND:-3000}:80"

volumes:
  mongo-data:
